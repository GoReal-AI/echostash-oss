name: Release

# Publishes every non-private package under packages/ to npm. Tokenless: npm trusted publishing
# over GitHub OIDC, with provenance attestations. Trigger: push a tag `v<x.y.z>` whose version
# matches the (lockstep) package versions. See CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, test, pack and pin, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'GoReal-AI/echostash-oss'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires a recent npm CLI
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Publishing something that does not pass its own checks is not a thing we do.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Tag matches the package versions (lockstep)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/check-versions.mjs "$GITHUB_REF_NAME"

      # npm (unlike pnpm) does not rewrite workspace:* on publish; pin to the real versions.
      - name: Pin workspace dependencies
        run: node scripts/release/pin-workspace-deps.mjs

      # Install the real CLI tarball somewhere clean and run it. Catches a broken bin path or a
      # missing runtime dependency, which a green build tells you nothing about.
      - name: Smoke-test the CLI tarball
        run: |
          (cd packages/cli && npm pack --pack-destination /tmp >/dev/null)
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install /tmp/echostash-cli-*.tgz >/dev/null
          ./node_modules/.bin/echostash --help
          ./node_modules/.bin/echostash mcp audit --from-file "$GITHUB_WORKSPACE/packages/cli/test/fixtures/surface.json"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry-run != true
        run: |
          set -euo pipefail
          # Dependency order, so a package's workspace deps exist on the registry first.
          for dir in $(node scripts/release/publishable.mjs | awk '{print $2}'); do
            name=$(node -p "require('$dir/package.json').name")
            echo "::group::npm publish $name"
            (cd "$dir" && npm publish --provenance --access public)
            echo "::endgroup::"
          done
